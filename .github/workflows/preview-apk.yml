name: Build Object Detective Safe Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - visual-refresh-safe-preview

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Build preview debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload safe preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Safe-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

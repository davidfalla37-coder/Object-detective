name: Build Object Detective Safe Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - visual-refresh-safe-preview

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable preview signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-key.jks

      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Build preview APK with stable signing
        env:
          PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify preview APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload safe preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Safe-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Preview package ID is com.objectdetective.app.preview2.
# This installs alongside the previous .preview test and the live Play app.

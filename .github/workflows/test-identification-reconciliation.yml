name: Test Object Detective identification reconciliation

on:
  push:
    branches: [restore-layout-with-history-safeguard, identification-one-update-preview]
  pull_request:
    branches: [main]

jobs:
  identification-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the isolated preview Edge Function
        run: deno check supabase/functions/investigate-object-preview/index.ts
      - name: Run identity conflict regression tests
        run: deno test supabase/functions/investigate-object-preview/identity-conflict_test.ts supabase/functions/investigate-object/identity-conflict_test.ts
      - name: Type-check preview identification function
        run: deno check supabase/functions/investigate-object-preview/index.ts

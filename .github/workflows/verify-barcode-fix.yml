name: Verify Object Detective Isolated Preview APK

on:
  push:
    branches:
      - fix/investigation-reliability-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare launcher icon resource
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Verify preview application ID
        run: |
          grep -q 'applicationIdSuffix ".preview"' app/build.gradle
          grep -q 'android:label="Object Detective Preview"' app/src/main/AndroidManifest.xml

      - name: Build isolated preview debug APK
        run: gradle --no-daemon assembleDebug

      - name: Launch preview on Android 16 emulator and capture screen
        id: emulator_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.objectdetective.app.preview/com.objectdetective.app.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/object-detective-preview.png
            adb pull /sdcard/object-detective-preview.png object-detective-preview.png
            test -s object-detective-preview.png

      - name: Upload isolated preview APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Isolated-Preview-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            object-detective-preview.png
          if-no-files-found: warn
          retention-days: 14

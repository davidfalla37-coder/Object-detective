name: Verify Object Detective Isolated Preview APK

on:
  push:
    branches:
      - fix/investigation-reliability-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare launcher icon resource
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Verify preview application ID
        run: |
          grep -q 'applicationIdSuffix ".preview"' app/build.gradle
          grep -q 'android:label="Object Detective Preview"' app/src/main/AndroidManifest.xml

      - name: Build isolated preview debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload isolated preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Isolated-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

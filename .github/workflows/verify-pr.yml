name: Verify Object Detective Android pull requests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'supabase/functions/investigate-object/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'privacy-policy.html'
      - 'account-deletion.html'
      - 'DATA_SAFETY_DRAFT.md'
      - 'RELEASE_CANDIDATE.md'
      - 'build.gradle'
      - 'settings.gradle'
      - 'ic_launcher.xml'
      - '.github/workflows/verify-pr.yml'

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Put app icon in Android resources
        run: |
          mkdir -p app/src/main/res/drawable
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
      - name: Build candidate APK
        run: gradle --no-daemon assembleDebug
      - name: Restore signing keystore
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/next-update-candidate'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-key.jks
      - name: Sign candidate APK with app signing key
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/next-update-candidate'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" sign \
            --ks signing-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/debug/app-candidate.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$APK_SIGNER" verify app/build/outputs/apk/debug/app-candidate.apk
      - name: Upload candidate APK
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/next-update-candidate'
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-1.10-candidate-install
          path: app/build/outputs/apk/debug/app-candidate.apk
          if-no-files-found: error
          retention-days: 7

  check-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Edge Function validation and safety handling
        run: deno test --allow-read=supabase/functions/investigate-object/index.ts supabase/functions/investigate-object/index_test.ts
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/investigate-object/index.ts

name: Build isolated Object Detective preview APK

on:
  push:
    branches:
      - restore-layout-with-history-safeguard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify protected layout and history features
        run: bash scripts/verify-protected-app-features.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare app icon resource
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp
      - name: Build isolated preview APK
        run: gradle --no-daemon assembleDebug -PpreviewInstall=true
      - name: Verify preview APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload isolated preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Isolated-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

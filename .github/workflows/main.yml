name: Build Object Detective Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-key.jks

      - name: Put app icon in Android resources
        run: |
          mkdir -p app/src/main/res/drawable
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

      - name: Build AAB
        run: gradle --no-daemon bundleRelease

      - name: Sign AAB
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          jarsigner \
            -keystore signing-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

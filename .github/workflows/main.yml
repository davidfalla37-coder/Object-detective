name: Build Object Detective APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep the same test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: object-detective-debug-signing-v1

      - name: Use camera MainActivity
        run: cp app/src/main/java/com/objectdetective/app/MainActivity.txt app/src/main/java/com/objectdetective/app/MainActivity.kt
      - name: Add app icon
        run: mkdir -p app/src/main/res/drawable && cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml      
      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

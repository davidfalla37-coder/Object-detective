name: Build Object Detective Google Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fail if refreshed layout or history-photo protection is missing
        run: |
          FILE="app/src/main/assets/index-2.html"
          grep -q 'id="od-bottom-nav"' "$FILE"
          grep -q 'od-screen' "$FILE"
          grep -q 'indexedDB.open(HISTORY_PHOTOS_DB' "$FILE"
          grep -q 'restoreHistoryPhotos(item.id)' "$FILE"
          grep -q 'async function saveInvestigation(data)' "$FILE"
          grep -q 'applicationIdSuffix ".test"' app/build.gradle
          grep -Fq 'functions/v1/investigate-object' "$FILE"
          ! grep -Fq 'functions/v1/investigate-object-preview' "$FILE"
          grep -q 'versionCode 21' app/build.gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-key.jks

      - name: Put app icon in Android resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Build AAB
        run: gradle --no-daemon bundleRelease

      - name: Sign AAB
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          jarsigner \
            -keystore signing-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-installable-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-key.jks
      - name: Put app icon in Android resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ic_launcher.webp app/src/main/res/drawable-nodpi/ic_launcher.webp
      - name: Build release APK
        run: gradle --no-daemon assembleRelease -PtestInstall=true
      - name: Sign installable APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out app/build/outputs/apk/release/object-detective-test.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/object-detective-test.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Object-Detective-Separate-Test-APK
          path: app/build/outputs/apk/release/object-detective-test.apk
          if-no-files-found: error

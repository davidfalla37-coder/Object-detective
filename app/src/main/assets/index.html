<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Detective</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #111827;
      color: white;
    }
    h1 { font-size: 32px; }
    button {
      padding: 16px 24px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🔎 Object Detective</h1>
  <p>Take a photo of an object and discover what it is.</p>
  <input type="file" accept="image/*" capture="environment">
  <br>
  <button>Identify Object</button>
</body>
</html>

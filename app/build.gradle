plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}

android {
    namespace 'com.objectdetective.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.objectdetective.app"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.9"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

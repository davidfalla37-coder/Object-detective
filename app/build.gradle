plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

android {
    namespace 'com.objectdetective.app'
    compileSdk 36

    signingConfigs {
        preview {
            storeFile rootProject.file("signing-key.jks")
            storePassword System.getenv("PREVIEW_KEYSTORE_PASSWORD")
            keyAlias System.getenv("PREVIEW_KEY_ALIAS")
            keyPassword System.getenv("PREVIEW_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.objectdetective.app"
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName "1.19"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".preview2"
            versionNameSuffix "-preview"
            signingConfig signingConfigs.preview
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

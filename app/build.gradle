plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.objectdetective.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.objectdetective.app"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}

android {
    namespace 'com.objectdetective.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.objectdetective.app"
        minSdk 26
        targetSdk 36
        versionCode 26
        versionName "1.25"
        if (project.hasProperty('previewInstall') && project.property('previewInstall') == 'true') {
            applicationIdSuffix ".preview2"
            manifestPlaceholders = [appLabel: "Object Detective Preview"]
        } else if (project.hasProperty('testInstall') && project.property('testInstall') == 'true') {
            applicationIdSuffix ".test"
            manifestPlaceholders = [appLabel: "Object Detective Test"]
        } else {
            manifestPlaceholders = [appLabel: "Object Detective"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
